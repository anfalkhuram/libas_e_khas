<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Libas e Khas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background-color: var(--color-dark);
        }
        .admin-login-card {
            background: var(--color-white);
            border-radius: 10px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            border-top: 5px solid var(--color-gold);
        }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="admin-login-card p-4 p-md-5 text-center">
                    <h1 class="font-heading mb-4 text-dark"><img src="../assets/images/logo.png" alt="Libas e Khas" class="logo mb-2" style="max-height: 60px;"><br>Libas e Khas <span class="d-block fs-5 text-muted font-body mt-2">Admin Portal</span></h1>
                    
                    <form action="dashboard.html" class="text-start">
                        <div class="mb-3">
                            <label class="form-label font-body small fw-bold">Admin Email</label>
                            <input type="email" class="form-control rounded-0 shadow-none border-dark" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label font-body small fw-bold">Password</label>
                            <input type="password" class="form-control rounded-0 shadow-none border-dark" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 font-body text-uppercase">Access Dashboard</button>
                    </form>
                    
                    <div class="mt-4">
                        <a href="../index.html" class="text-muted small font-body"><i class="fas fa-arrow-left me-1"></i> Back to Store</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
